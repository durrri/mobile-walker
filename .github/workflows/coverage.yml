name: Coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Vitest coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            echo "Command: \`npm run coverage\`"
            echo
            echo "Coverage is informational and is not a merge requirement."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: coverage
          if-no-files-found: warn
          retention-days: 7
