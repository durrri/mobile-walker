name: Extended validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended:
    name: Extended river tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run extended validation
        run: |
          set -euo pipefail
          npm run test:extended 2>&1 | tee extended-validation.log

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Extended validation"
            echo
            echo "Command: \`npm run test:extended\`"
            echo
            echo "This manual workflow runs the expensive river validation outside normal PR CI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload extended validation output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extended-validation-output
          path: extended-validation.log
          if-no-files-found: warn
          retention-days: 7
