name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test deterministic generation
        run: npm test

      - name: Build
        run: npm run build:cloudflare

      - name: Check whitespace errors
        run: git diff --check

      - name: Report build size
        run: npm run report:build-size >> "$GITHUB_STEP_SUMMARY"
