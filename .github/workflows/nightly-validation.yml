name: Nightly broad validation

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broad:
    name: Broad validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run default tests
        run: npm test 2>&1 | tee nightly-default-tests.log

      - name: Run extended river tests
        run: npm run test:extended 2>&1 | tee nightly-extended-tests.log

      - name: Run repeated targeted tests
        run: |
          set -euo pipefail
          for repetition in $(seq 1 10); do
            echo "## Repetition ${repetition}/10" | tee -a nightly-repeatable-tests.log
            npm run test:repeatable 2>&1 | tee -a nightly-repeatable-tests.log
          done

      - name: Run river benchmark
        run: npm run benchmark:river 2>&1 | tee nightly-river-benchmark.log

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Nightly broad validation"
            echo
            echo "Runs default tests, extended river tests, 10 repeated deterministic/lifecycle checks, and an informational river benchmark."
            echo
            echo "Long traversal, larger seed sweeps, and additional topology suites are future validation additions; this workflow does not include placeholder tests for missing coverage."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nightly logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-validation-logs
          path: nightly-*.log
          if-no-files-found: warn
